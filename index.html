<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--b:#0b3a6f;--b2:#1f6fb8;--bg:#f2f5fa;--c:#fff;--t:#1b2433;--m:#6b7688;--l:#dfe5ee;--ok:#1a9d6b;--bad:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{background:var(--c);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
.hd{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.logo{height:34px}.wm{font-weight:700;font-size:22px;letter-spacing:3px;color:var(--b)}
.wrap{max-width:860px;margin:20px auto;padding:0 14px}.wrap.wide{max-width:1080px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(11,58,111,.05)}
.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border:0}.hero h1{margin:0 0 4px;font-size:26px}.hero .en{color:#cfe3f8}
.en{color:var(--m);font-size:.88em}h2{margin:0 0 4px;color:var(--b)}h3{margin:18px 0 8px;color:var(--b);font-size:1.02rem;border-left:4px solid var(--b2);padding-left:10px}
.btn{border:0;border-radius:9px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--b);color:#fff}.btn:hover{background:var(--b2)}
.btn.s{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.d{background:var(--bad)}.btn.sm{padding:5px 11px;font-size:.85rem}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--b2);transition:.3s}
.q{padding:14px 0;border-bottom:1px solid var(--l)}.q:last-child{border:0}.q.err{background:#fff4f4;border-radius:8px;padding:14px 10px}.q label.t{display:block;font-weight:500}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--l);border-radius:9px;font:inherit;margin-top:6px;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid #b9d6f2;border-color:var(--b2)}
.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 0}.opt input{margin-top:5px;accent-color:var(--b)}
.rt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.rt label{cursor:pointer}.rt input{display:none}
.rt span{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border:1px solid var(--l);border-radius:10px;font-size:.72rem;text-align:center;height:100%;color:var(--m)}
.rt b{font-size:1.2rem;color:var(--t)}.rt input:checked+span{background:var(--b);border-color:var(--b);color:#dbe9f7}.rt input:checked+span b{color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--l);background:#fff;padding:8px 16px;border-radius:9px;font:inherit;cursor:pointer}.tabs .on{background:var(--b);color:#fff;border-color:var(--b)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px}
.kpi small{color:var(--m);display:block}.kpi b{font-size:1.7rem;color:var(--b)}.kpi.g b{color:var(--ok)}.kpi.r b{color:var(--bad)}
.row{display:grid;grid-template-columns:minmax(120px,38%) 1fr 48px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}.row .tr{height:10px;background:var(--l);border-radius:8px;overflow:hidden}.row .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--b2),var(--b))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600}
.scroll{overflow-x:auto}.cm{background:#f7f9fc;border-left:3px solid var(--b2);padding:8px 12px;margin:8px 0;border-radius:6px;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.modal.on{display:flex}
.mb{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:30;max-width:92%}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.75rem;background:#e6eef8;color:var(--b)}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.hero h1{font-size:20px}.rt span{font-size:.62rem}.row{grid-template-columns:1fr 60px 40px}.card{padding:16px}}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.fl>div{flex:1;min-width:130px}.fl label{font-size:.8rem;color:var(--m)}.chip{display:inline-block;background:#e6eef8;color:var(--b);border-radius:20px;padding:2px 10px;margin:2px;font-size:.78rem}
</style></head><body>

let SECS=[],CFG={},Q=[],A={},step=0,S=null,tab='dash',DB=null,QL=[],UL=[];
const bi=(th,en)=>`${E(th)}<br><span class="en">${E(en)}</span>`;
async function init(){try{const r=await run('getSurvey');CFG=r.cfg;Q=r.questions;SECS=r.sections;
 $('#brand').innerHTML=`<img class="logo" src="${E(CFG.logoUrl||LOGO)}" alt="TOPPAN">`;render()}catch(e){toast(e)}}
function hbtn(){$('#hbtn').innerHTML=S?`<span class="en">${E(S.name)} <span class="pill">${S.role}</span></span> <button class="btn s sm" onclick="${S&&tab==='survey'?'':''}toggleView()">${view==='admin'?'แบบสอบถาม / Survey':'ระบบหลังบ้าน / Dashboard'}</button> <button class="btn sm" onclick="doLogout()">ออก / Logout</button>`:`<button class="btn s sm" onclick="mopen('lg')">🔒 แอดมิน / Admin</button>`}
let view='survey';
function toggleView(){view=view==='admin'?'survey':'admin';render()}
function render(){hbtn();$('#app').className='wrap'+(view==='admin'?' wide':'');view==='admin'?renderAdmin():renderSurvey()}
/* ---------- Survey ---------- */
function renderSurvey(){
 if(step===-1){$('#app').innerHTML=`<div class="card" style="text-align:center;padding:50px 20px"><div style="font-size:54px">✅</div><h2>${tb('thanksTh')}</h2><div class="en">${tb('thanksEn')}</div><br><button class="btn" onclick="A={};step=0;render()">ทำแบบสอบถามใหม่ / New response</button></div>`;return}
 if(step===0){$('#app').innerHTML=`<div class="card hero"><h1>${tb('titleTh')}</h1><div class="en" style="font-size:1.1rem">${tb('titleEn')}</div><p style="margin:14px 0 0">${tb('introTh')}<br><span class="en">${tb('introEn')}</span></p></div>
 <div class="card"><h2>${tb('instrTitleTh')} <span class="en">${tb('instrTitleEn')}</span></h2><p>${tb('instrTh')}</p><p class="en">${tb('instrEn')}</p><p><b>${tb('listTh')}</b> <span class="en">${tb('listEn')}</span></p>${SECS.map(s=>`<div class="opt">▸<div>${bi(s.th,s.en)}</div></div>`).join('')}<div class="nav"><span></span><button class="btn" onclick="step=1;render();scrollTo(0,0)">${tb('startTh')} / ${tb('startEn')} →</button></div></div>`;return}
 const sc=SECS[step-1],qs=Q.filter(q=>q.section===sc.id),ms=new Set(qs.map(q=>q.gid)).size>1;let g='',h='';
 qs.forEach(q=>{if(q.group_th!==g){g=q.group_th;if(ms)h+=`<h3>${bi(q.group_th,q.group_en)}</h3>`;if(q.type==='rating'&&!qs.some(x=>x.group_th===g&&x.type==='rating'&&x!==q&&qs.indexOf(x)<qs.indexOf(q)))h+=`<div class="en" style="margin-bottom:4px">(1) ไม่พอใจอย่างมาก · (2) ไม่พอใจ · (3) ปานกลาง · (4) พอใจ · (5) พอใจอย่างมาก</div>`}h+=qHtml(q)});
 $('#app').innerHTML=`<div class="bar"><i style="width:${step/SECS.length*100}%"></i></div><div class="card"><h2>${E(sc.th)}</h2><div class="en">${E(sc.en)}</div>${h}</div>
 <div class="nav"><button class="btn s" onclick="go(-1)">← ย้อนกลับ / Back</button><button class="btn" onclick="go(1)">${step===SECS.length?'ส่งแบบสอบถาม / Submit ✓':'ถัดไป / Next →'}</button></div>`}
function qHtml(q){const id=q.id,v=A[id],req=q.required===true||String(q.required).toUpperCase()==='TRUE',star=req?' <span style="color:var(--bad)">*</span>':'';
 let b='';const opts=String(q.options||'').split('\n').filter(Boolean).map(l=>l.split('|'));
 if(q.type==='text')b=`<input type="text" data-q="${id}" value="${E(v)}">`;
 else if(q.type==='comment')b=`<textarea rows="3" data-q="${id}" placeholder="ระบุรายละเอียด / Please describe">${E(v)}</textarea>`;
 else if(q.type==='rating')b=`<div class="rt">${LV.map((l,i)=>`<label><input type="radio" name="${id}" data-q="${id}" value="${i+1}" ${v==i+1?'checked':''}><span><b>${i+1}</b>${l[0]}<small>${l[1]}</small></span></label>`).join('')}</div>`;
 else{const m=q.type==='multi';b=opts.map(o=>`<label class="opt"><input type="${m?'checkbox':'radio'}" name="${id}" data-q="${id}" value="${E(o[0])}" ${(m?(v||[]).includes(o[0]):v===o[0])?'checked':''}><span>${E(o[0])}<br><span class="en">${E(o[1]||'')}</span></span></label>`).join('');
  if(q.other===true||String(q.other).toUpperCase()==='TRUE')b+=`<input type="text" data-q="${id}_other" placeholder="ระบุเพิ่มเติม / Please specify" value="${E(A[id+'_other'])}">`}
 return `<div class="q" id="q_${id}"><label class="t">${bi(q.th,q.en)}${star}</label>${b}</div>`}
document.addEventListener('input',e=>{const t=e.target,q=t.dataset&&t.dataset.q;if(!q)return;
 if(t.type==='checkbox'){const a=A[q]||[];A[q]=t.checked?[...a,t.value]:a.filter(x=>x!==t.value)}else A[q]=t.value;const b=document.getElementById('q_'+q);if(b)b.classList.remove('err')});
function ok(){let bad=null;Q.filter(q=>q.section===SECS[step-1].id&&(q.required===true||String(q.required).toUpperCase()==='TRUE')).forEach(q=>{const v=A[q.id];if(!v||!String(v).trim()||(Array.isArray(v)&&!v.length)){const el=$('#q_'+q.id);el&&el.classList.add('err');bad=bad||el}});
 if(bad){bad.scrollIntoView({behavior:'smooth',block:'center'});toast('กรุณาตอบข้อที่จำเป็น / Please answer required questions');return false}return true}
async function go(d){if(d>0&&!ok())return;if(d>0&&step===SECS.length){try{await run('submitSurvey',A);step=-1;A={};render()}catch(e){toast(e)}return}step+=d;render();scrollTo(0,0)}
/* ---------- Auth ---------- */
async function doLogin(){try{const r=await run('login',$('#lu').value,$('#lp').value);S=r.user;S.token=r.token;mclose('lg');view='admin';tab='dash';$('#lp').value='';render()}catch(e){toast(e)}}
async function doLogout(){try{await run('logout',S.token)}catch(e){}S=null;view='survey';step=0;render()}
/* ---------- Admin ---------- */

async function doExport(){try{toast('กำลังสร้างไฟล์ / Generating...');const r=await run('exportXlsx',S.token,F);const a=document.createElement('a');a.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+r.b64;a.download=r.name;a.click()}catch(e){toast(e)}}
const gQs=gid=>QL.filter(q=>String(q.gid)===String(gid)).sort((a,b)=>a.order-b.order);
const qRows=g=>{const qs=gQs(g.id);return qs.map((q,i)=>`<div class="q" style="padding:8px 0;display:flex;gap:10px;align-items:center;${T(q.active)?'':'opacity:.5'}">${q.type==='rating'?`<input type="checkbox" style="width:20px;height:20px;margin:0;accent-color:var(--b)" ${T(q.scored)?'checked':''} onchange="togQ('${q.id}',this.checked)" title="นับคะแนน / Scored">`:'<span style="width:20px"></span>'}<div style="flex:1;min-width:0">${E(q.th)}<br><span class="en">${E(q.en)}</span></div><span class="pill">${q.type}</span><span style="white-space:nowrap"><button class="btn s sm" onclick="mvQ('${q.id}',-1)" ${i?'':'disabled'}>▲</button> <button class="btn s sm" onclick="mvQ('${q.id}',1)" ${i<qs.length-1?'':'disabled'}>▼</button> <button class="btn s sm" onclick="qEdit('${q.id}')">แก้ไข</button> <button class="btn d sm" onclick="qDel('${q.id}')">ลบ</button></span></div>`).join('')+`<button class="btn s sm" style="margin-top:8px" onclick="qEdit('','${g.id}')">+ เพิ่มคำถามย่อย / Add question</button>`};
function qListHtml(){const w=wsum();
 $('#pane').innerHTML=`<div class="card"><div class="nav" style="margin:0 0 6px"><h2>จัดการแบบประเมิน <span class="en">Builder</span></h2><button class="btn" onclick="secEdit()">+ เพิ่มหัวข้อหลัก / Section</button></div>
 <p class="en" style="margin:0 0 8px">① ตั้ง % ที่หัวข้อหลัก ② เพิ่มคำถามย่อยในหัวข้อ ③ ติ๊ก ☑ ข้อ rating ที่ต้องการนำไปคิดคะแนน → คะแนนหัวข้อ = (ผลรวมคะแนนข้อที่ติ๊ก ÷ จำนวนข้อที่ติ๊ก ÷ 5) × % ของหัวข้อ · คะแนนรวม = ผลรวมทุกหัวข้อ / Score = (sum of ticked ÷ count ÷ 5) × section %.</p>
 <b>น้ำหนักรวม / Total weight: <span style="color:${w===100?'var(--ok)':'var(--bad)'}">${w}%</span></b> ${w===100?'':'<span class="en">(ควรเป็น 100 / should be 100)</span>'}</div>
 ${[...ST.sections].sort((a,b)=>a.order-b.order).map(s=>{const gs=ST.groups.filter(g=>String(g.section)===String(s.id)).sort((a,b)=>a.order-b.order),k=gs.length,n=gs.reduce((c,g)=>c+gQs(g.id).filter(q=>q.type==='rating'&&T(q.scored)&&T(q.active)).length,0),wt=Number(s.weight)||0;
 const info=wt>0?(n?(k>1?`คิดคะแนน ${n} ข้อ · แต่ละกลุ่มย่อยได้ ${(wt/k).toFixed(2)}% (เฉลี่ยจากข้อที่ติ๊กในกลุ่มนั้น)`:`คิดคะแนน ${n} ข้อ · เต็มข้อละ ${(wt/n).toFixed(2)}% (ของคะแนนรวม)`):'⚠ ยังไม่มีข้อที่ติ๊กนับคะแนน / no scored questions'):'ไม่คิดคะแนน (0%) / not scored';
 return `<div class="card" style="${T(s.active)?'':'opacity:.6'}"><div class="nav" style="margin:0 0 4px;flex-wrap:wrap;align-items:center"><div><b style="color:var(--b)">${E(s.th)}</b><br><span class="en">${E(s.en)}</span></div><div style="white-space:nowrap">น้ำหนัก <input type="number" min="0" max="100" step="any" value="${wt}" style="width:76px;display:inline-block;margin:0" onchange="setSW('${s.id}',this.value)"> % <button class="btn s sm" onclick="secEdit('${s.id}')">แก้ไข</button> <button class="btn d sm" onclick="secDel('${s.id}')">ลบ</button></div></div><div class="en" style="margin-bottom:4px">${info}</div>
 ${k===1?qRows(gs[0]):gs.map(g=>`<div style="border:1px dashed var(--l);border-radius:10px;padding:10px;margin:8px 0"><div class="nav" style="margin:0 0 4px"><b>${E(g.th)}</b><span style="white-space:nowrap"><button class="btn s sm" onclick="grEdit('${g.id}')">แก้ไข</button> <button class="btn d sm" onclick="grDel('${g.id}')">ลบ</button></span></div>${qRows(g)}</div>`).join('')}
 <button class="btn s sm" style="margin-top:8px" onclick="grEdit('','${s.id}')">+ กลุ่มย่อย / Sub-group</button></div>`}).join('')}`}
async function setSW(id,v){const s=ST.sections.find(x=>String(x.id)===String(id)),o=s.weight;s.weight=Number(v)||0;try{await run('saveSection',S.token,s)}catch(e){s.weight=o;toast(e)}qListHtml()}
async function togQ(id,c){const q=QL.find(x=>x.id===id),o=q.scored;q.scored=c;try{await run('saveQuestion',S.token,q)}catch(e){q.scored=o;toast(e)}qListHtml()}
async function mvQ(id,d){const q=QL.find(x=>x.id===id),a=gQs(q.gid),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];
 try{for(let k=0;k<a.length;k++){const n=(k+1)*10;if(a[k].order!==n){a[k].order=n;await run('saveQuestion',S.token,a[k])}}}catch(e){toast(e)}qListHtml()}
const T=v=>v===true||String(v).toUpperCase()==='TRUE';
function qEdit(id,pg){const q=QL.find(x=>x.id===id)||{gid:pg||(ST.groups[0]||{}).id,scored:true,type:'rating',th:'',en:'',options:'',other:false,required:true,active:true,order:(QL.length+1)*10};
 $('#mdb').innerHTML=`<h2>${id?'แก้ไข':'เพิ่ม'}คำถาม <span class="en">${id?'Edit':'Add'} question</span></h2><input type="hidden" id="f_id" value="${E(id||'')}">
 <label>กลุ่ม / Group</label><select id="f_gid">${ST.groups.map(g=>{const s=ST.sections.find(x=>String(x.id)===String(g.section))||{};return `<option value="${E(g.id)}" ${q.gid==g.id?'selected':''}>${E((s.th||'').slice(0,26))} › ${E(g.th)}</option>`}).join('')}</select>
 
 <label>ประเภท / Type</label><select id="f_type">${['rating','text','comment','select','multi'].map(t=>`<option ${q.type===t?'selected':''}>${t}</option>`).join('')}</select>
 <label>คำถาม (ไทย) / Question TH</label><textarea id="f_th" rows="2">${E(q.th)}</textarea><label>Question EN</label><textarea id="f_en" rows="2">${E(q.en)}</textarea>
 <label>ตัวเลือก (1 บรรทัด = ไทย|English) / Options</label><textarea id="f_op" rows="4">${E(q.options)}</textarea>
 <label>ลำดับ / Order</label><input type="number" id="f_ord" value="${q.order}">
 <label class="opt"><input type="checkbox" id="f_other" ${T(q.other)?'checked':''}> มีช่อง "อื่น ๆ/ระบุ" / Allow other text</label><label class="opt"><input type="checkbox" id="f_sc" ${T(q.scored)?'checked':''}> นับคะแนน (เฉพาะ rating) / Scored</label><label class="opt"><input type="checkbox" id="f_req" ${T(q.required)?'checked':''}> บังคับตอบ / Required</label><label class="opt"><input type="checkbox" id="f_act" ${T(q.active)?'checked':''}> เปิดใช้งาน / Active</label>
 <div class="nav"><button class="btn s" onclick="mclose('md')">ยกเลิก</button><button class="btn" onclick="qSave()">บันทึก / Save</button></div>`;mopen('md')}
async function qSave(){const q={id:$('#f_id').value,gid:$('#f_gid').value,scored:$('#f_sc').checked,type:$('#f_type').value,th:$('#f_th').value,en:$('#f_en').value,options:$('#f_op').value,other:$('#f_other').checked,required:$('#f_req').checked,active:$('#f_act').checked,order:+$('#f_ord').value};
 if(!q.th){toast('กรุณากรอกคำถาม');return}try{await run('saveQuestion',S.token,q);mclose('md');renderAdmin()}catch(e){toast(e)}}
async function qDel(id){if(!confirm('ลบคำถามนี้? / Delete this question?'))return;try{await run('deleteQuestion',S.token,id);renderAdmin()}catch(e){toast(e)}}
function uListHtml(){$('#pane').innerHTML=`<div class="card"><div class="nav" style="margin:0 0 10px"><h2>จัดการผู้ใช้ <span class="en">Manage users</span></h2><button class="btn" onclick="uEdit()">+ เพิ่ม / Add</button></div><div class="scroll"><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>${UL.map(u=>`<tr><td>${E(u.username)}</td><td>${E(u.name)}</td><td><span class="pill">${u.role}</span></td><td>${u.active?'✓':'✗'}</td><td style="white-space:nowrap"><button class="btn s sm" onclick="uEdit('${E(u.username)}')">แก้ไข</button> <button class="btn d sm" onclick="uDel('${E(u.username)}')">ลบ</button></td></tr>`).join('')}</table></div><p class="en">admin = จัดการทุกอย่าง / full access · viewer = ดูทุกลูกค้า / all customers · sales = ดูเฉพาะลูกค้าที่ผูกไว้ของตน / own customers only</p></div>`}
function uEdit(n){const u=UL.find(x=>x.username===n)||{username:'',name:'',role:'viewer',active:true};
 $('#mdb').innerHTML=`<h2>ผู้ใช้ <span class="en">User</span></h2><label>Username</label><input type="text" id="u_u" value="${E(u.username)}" ${n?'readonly':''}><label>ชื่อ / Name</label><input type="text" id="u_n" value="${E(u.name)}">
 <label>รหัสผ่าน${n?' (เว้นว่างถ้าไม่เปลี่ยน)':''} / Password</label><input type="password" id="u_p" autocomplete="new-password"><label>สิทธิ์ / Role</label><select id="u_r"><option ${u.role==='viewer'?'selected':''}>viewer</option><option ${u.role==='admin'?'selected':''}>admin</option><option ${u.role==='sales'?'selected':''}>sales</option></select>
 <label class="opt"><input type="checkbox" id="u_a" ${u.active?'checked':''}> เปิดใช้งาน / Active</label><div class="nav"><button class="btn s" onclick="mclose('md')">ยกเลิก</button><button class="btn" onclick="uSave()">บันทึก / Save</button></div>`;mopen('md')}
async function uSave(){try{await run('saveUser',S.token,{username:$('#u_u').value.trim(),name:$('#u_n').value,password:$('#u_p').value,role:$('#u_r').value,active:$('#u_a').checked});mclose('md');renderAdmin()}catch(e){toast(e)}}
async function uDel(n){if(!confirm('ลบผู้ใช้? / Delete user?'))return;try{await run('deleteUser',S.token,n);renderAdmin()}catch(e){toast(e)}}
init();
</script></body></html>
